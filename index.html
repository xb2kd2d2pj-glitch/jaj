<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body { background: black; color: #00ff00; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; }
        .spinner { border: 4px solid #111; border-top: 4px solid #00ff00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #logs { margin-top: 20px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div id="logs">Connecting to KGD-SERVER...</div>
    <script>
        const texts = ["Bypassing firewall...", "Accessing database...", "Downloading files...", "Decrypting data..."];
        let i = 0;
        setInterval(() => {
            document.getElementById('logs').innerText = texts[i % texts.length];
            i++;
        }, 2000);
    </script>
</body>
</html>
